name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test
      # The autopilot's TypeSafe strategist (src/autopilot/advisor.rs) is
      # behind a feature; its tests use judgment::Fake and call no API.
      - name: cargo clippy (typesafe)
        run: cargo clippy --all-targets --features typesafe -- -D warnings
      - name: cargo test (typesafe)
        run: cargo test --features typesafe
