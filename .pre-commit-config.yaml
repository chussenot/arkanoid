# See https://prek.j178.dev for more information.
# Vendored third-party content is kept byte-for-byte as upstream ships it:
# the Impeccable skill (Apache-2.0) has files over the 500 KB limit and its
# own whitespace conventions; the JetBrains Mono license text (OFL.txt) has
# trailing spaces upstream; the Electric Pulse engine (audio/engine/) has
# trailing spaces in abc.c; the vendored build-time C headers (audio/vendor/)
# are kept as upstream ships them.
exclude: ^(\.claude/skills/impeccable/|assets/fonts/|audio/engine/|audio/vendor/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
