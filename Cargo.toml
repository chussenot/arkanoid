[package]
name = "arkanoid"
version = "0.1.0"
edition = "2021"
# src/bin/bench_render3d.rs (arkanoid-v2-c5) made this crate multi-binary,
# so `cargo run`/`mise run run` need to be told which one is the actual
# game -- otherwise cargo refuses to guess between it and bench_render3d.
default-run = "arkanoid"

[dependencies]
bytemuck = "1.25.2"
glyphon = "0.12.0"
# Decodes the optional Kenney asset pack (bead arkanoid-v2-b3,
# `assets::TextureSource::Pack`) into RGBA8 for `Atlas::set_sprite`.
# `default-features = false` + `features = ["png"]`: the pack this repo's
# fetch script produces is PNG-only, and every other format decoder
# (jpeg/gif/webp/tiff/...) the crate ships would just be dead compile
# weight on this fixed dependency budget. Explicitly authorized by this
# bead's bd description.
image = { version = "0.25.9", default-features = false, features = ["png"] }
rand = "0.10.2"
wgpu = "30.0.0"
winit = "0.30.13"
# src/render3d/ (arkanoid-v2-c1) needs a view/projection matrix and
# perspective divide for its cinematic camera. glam is the community-
# standard math crate for exactly this (see docs/spec.md's "no hand-rolled
# 4x4 math" framing) and its `Mat4::perspective_rh` already targets wgpu's
# 0..1 clip-space depth range, unlike hand-rolling the OpenGL -1..1
# convention wrong. Used only by render3d/ -- the classic 2D renderer has
# no matrices to justify pulling this in for itself.
glam = "0.33.3"

# --- autopilot (src/autopilot/) ---------------------------------------------
# Off by default so a fresh clone builds with the spec's dependency budget
# and no network stack. `--autopilot` works without it, on the deterministic
# lane heuristic; this feature adds the TypeSafe System One strategist.
[features]
typesafe = ["dep:judgment", "dep:tokio", "dep:serde_json"]

[dependencies.judgment]
# The typed System One client: questions with typed answers, every answer
# verified against the question before it is read (an off-list lane is an
# error, never a default), and the official SDKs' retry semantics.
version = "0.13"
optional = true

[dependencies.tokio]
# `judgment` is async; the autopilot runs it on one worker thread with a
# current-thread runtime (`autopilot/advisor.rs`), never on the game loop.
version = "1"
features = ["rt", "time"]
optional = true

[dependencies.serde_json]
# The state sent with each question (`judgment` takes a `serde_json::Value`).
version = "1"
optional = true
